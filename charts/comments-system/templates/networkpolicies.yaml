apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app: comments-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: {{ .Values.namespace }}
  labels:
    app: comments-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend-api
  namespace: {{ .Values.namespace }}
  labels:
    app: comments-system
spec:
  podSelector:
    matchLabels:
      app: comments-system
      tier: backend-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: comments-system
              tier: frontend
      ports:
        - protocol: TCP
          port: {{ .Values.backendApi.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-api-to-backend-data
  namespace: {{ .Values.namespace }}
  labels:
    app: comments-system
spec:
  podSelector:
    matchLabels:
      app: comments-system
      tier: backend-data
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: comments-system
              tier: backend-api
      ports:
        - protocol: TCP
          port: {{ .Values.backendData.port }}
---
apiVersion: networking.k8s.io/v1
