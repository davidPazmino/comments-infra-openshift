apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: {{ .Values.namespace }}
  labels:
    app: comments-system
    tier: database
spec:
  replicas: {{ .Values.replicaCount.db }}
  selector:
    matchLabels:
      app: comments-system
      tier: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: comments-system
        tier: database
    spec:
      containers:
        - name: db
          image: "{{ printf "%s:%s" .Values.image.db.repository .Values.image.db.tag }}"
          imagePullPolicy: {{ .Values.image.db.pullPolicy }}
          ports:
            - containerPort: {{ .Values.db.port }}
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.db.database }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
{{- with .Values.db.env }}
{{- toYaml . | nindent 12 }}
{{- end }}
          volumeMounts:
{{- if .Values.db.volumeMounts }}
{{- toYaml .Values.db.volumeMounts | nindent 12 }}
{{- else }}
            - name: db-storage
              mountPath: /var/lib/postgresql/data
{{- end }}
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc
