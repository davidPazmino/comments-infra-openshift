apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: {{ .Values.namespace }}
  labels:
    app: comments-system
    tier: backend-api
spec:
  selector:
    app: comments-system
    tier: backend-api
  ports:
    - name: http
      port: {{ .Values.backendApi.port }}
      targetPort: {{ .Values.backendApi.port }}
