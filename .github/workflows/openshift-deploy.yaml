name: Deploy to OpenShift

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -sSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz oc kubectl
          sudo mv oc /usr/local/bin/oc
          sudo chmod +x /usr/local/bin/oc
          rm -f oc.tar.gz kubectl

      - name: Install Helm 3
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true

      - name: Select namespace
        env:
          COMMENTS_NAMESPACE: ${{ secrets.COMMENTS_NAMESPACE }}
        run: |
          TARGET_NAMESPACE=${COMMENTS_NAMESPACE:-darkblade-x-dev}
          echo "Using namespace: $TARGET_NAMESPACE"
          echo "NOTE: Namespace must already exist. Workflow will NOT create, patch or annotate namespaces."
          oc project "$TARGET_NAMESPACE"

      - name: Deploy with Helm
        env:
          COMMENTS_NAMESPACE: ${{ secrets.COMMENTS_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TARGET_NAMESPACE=${COMMENTS_NAMESPACE:-darkblade-x-dev}

          helm upgrade --install comments-system charts/comments-system \
            --namespace "$TARGET_NAMESPACE" \
            --create-namespace=false \
            --set image.frontend.repository="$DOCKERHUB_USERNAME/comments-frontend" \
            --set image.backendApi.repository="$DOCKERHUB_USERNAME/comments-backend-api" \
            --set image.backendData.repository="$DOCKERHUB_USERNAME/comments-backend-data"